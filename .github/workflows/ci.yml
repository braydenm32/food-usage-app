name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route and layout types (RouteContext, LayoutProps) are generated by Next.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=high
